name: CI
on:
  push:
    branches: main
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout the code
        uses: actions/checkout@v7

      - name: Docker setup [login]
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ vars.secrets.DOCKERHUB.ROKEN }}
